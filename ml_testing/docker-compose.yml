services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Hot-reload: mount source code for development
      - .:/app
    environment:
      - DEBUG=true
      - API_HOST=0.0.0.0
      - API_PORT=8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
